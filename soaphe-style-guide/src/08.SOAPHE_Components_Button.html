<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;600;700;800&family=Noto+Serif+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
  --soaphe-ivory-50: #FAF8F3;
  --soaphe-ivory-100: #F4F0E8;
  --soaphe-cream-200: #EAE2D5;
  --soaphe-beige-300: #D7C7B5;
  
  --soaphe-taupe-300: #B5A89B;
  --soaphe-taupe-500: #8D8074;
  --soaphe-taupe-700: #63574C;
  
  --soaphe-brown-500: #7B685B;
  --soaphe-brown-700: #51433A;
  --soaphe-brown-900: #2C2521;
  
  --soaphe-olive-100: #E8EADF;
  --soaphe-olive-500: #777B5D;
  --soaphe-olive-700: #4E5239;
  
  --soaphe-rose-100: #F1E2DF;
  --soaphe-rose-500: #B77970;
  --soaphe-rose-700: #844D45;
  
  --soaphe-amber-100: #F4E7D3;
  --soaphe-amber-500: #B8834D;
  --soaphe-amber-700: #83572A;
  
  --soaphe-white-1000: #FFFFFF;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: 'Plus Jakarta Sans', 'Noto Sans KR', -apple-system, sans-serif;
  background-color: var(--soaphe-ivory-50);
  color: var(--soaphe-brown-900);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 32px 36px 32px;
  width: 1152px;
  min-height: 100px;
}

.guide-page {
  width: 100%;
  display: flex;
  flex-direction: column;
}

.guide-header {
  margin-bottom: 24px;
}

.guide-title {
  font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
  font-size: 28px;
  font-weight: 800;
  color: var(--soaphe-brown-900);
  letter-spacing: -0.4px;
  margin-bottom: 8px;
}

.guide-desc {
  font-size: 14.5px;
  color: var(--soaphe-taupe-700);
  line-height: 1.55;
  margin-bottom: 12px;
  font-weight: 400;
}

.guide-meta {
  font-size: 12.5px;
  color: var(--soaphe-olive-500);
  font-weight: 600;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
}

.canvas-board {
  background: var(--soaphe-ivory-100);
  border: 1px solid var(--soaphe-cream-200);
  border-radius: 18px;
  padding: 32px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.section-label {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--soaphe-taupe-700);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.serif-font {
  font-family: 'Noto Serif KR', 'Cormorant Garamond', Georgia, serif;
}

.mono-font {
  font-family: 'JetBrains Mono', monospace;
}

/* Texture Placeholder styling */
.ceramic-texture {
  background: radial-gradient(circle at 40% 35%, #FFFFFF 0%, #F4F0E8 55%, #EAE2D5 100%);
  border: 1px solid var(--soaphe-cream-200);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.ceramic-texture::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(#8D8074 0.75px, transparent 0.75px);
  background-size: 16px 16px;
  opacity: 0.08;
}

.btn-matrix {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 14px 16px;
  width: 100%;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: inherit;
  font-weight: 600;
  border-radius: 9999px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.2s;
  width: 100%;
}
.btn-md { height: 44px; font-size: 13.5px; padding: 0 18px; }
.btn-sm { height: 36px; font-size: 12px; padding: 0 14px; }

.btn-primary { background: #2C2521; color: #FAF8F3; }
.btn-primary-hover { background: #51433A; color: #FAF8F3; }
.btn-primary-pressed { background: #191412; color: #FAF8F3; }
.btn-primary-focus { background: #2C2521; color: #FAF8F3; outline: 2px solid #B8834D; outline-offset: 2px; }
.btn-primary-disabled { background: #F4F0E8; color: #B5A89B; border-color: #EAE2D5; cursor: not-allowed; }

.btn-secondary { background: transparent; color: #2C2521; border-color: #51433A; }
.btn-secondary-hover { background: #F4F0E8; color: #2C2521; border-color: #2C2521; }
.btn-secondary-pressed { background: #EAE2D5; color: #2C2521; border-color: #2C2521; }
.btn-secondary-focus { background: transparent; color: #2C2521; border-color: #51433A; outline: 2px solid #B8834D; outline-offset: 2px; }
.btn-secondary-disabled { background: transparent; color: #B5A89B; border-color: #EAE2D5; cursor: not-allowed; }

.btn-text { background: transparent; color: #2C2521; padding: 0 8px; justify-content: flex-start; }
.btn-text-hover { background: transparent; color: #B8834D; }
.btn-text-focus { outline: 2px solid #B8834D; outline-offset: 2px; }
</style>
</head>
<body>
  <div class="guide-page">
    <div class="guide-header">
      <div class="guide-title">Button</div>
      <div class="guide-desc">주요 행동의 위계가 명확하게 보이도록 Size 3종 × Style 4종 × State 5종으로 관리합니다.</div>
      <div class="guide-meta">PROPERTY Label / Icon · VARIANTS Size / Style / State / Width · ACCESSIBILITY Focus 2px, 최소 높이 44px</div>
    </div>

    <div class="canvas-board">
      <div class="section-label">Primary & Secondary Style (States: Default, Hover, Pressed, Focus, Disabled)</div>
      
      <!-- Primary Row -->
      <div class="btn-matrix">
        <button class="btn btn-md btn-primary">제품 보러 가기 →</button>
        <button class="btn btn-md btn-primary-hover">제품 보러 가기 →</button>
        <button class="btn btn-md btn-primary-pressed">제품 보러 가기 →</button>
        <button class="btn btn-md btn-primary-focus">제품 보러 가기 →</button>
        <button class="btn btn-md btn-primary-disabled">제품 보러 가기 →</button>
      </div>

      <!-- Secondary Row -->
      <div class="btn-matrix">
        <button class="btn btn-md btn-secondary">장바구니 담기</button>
        <button class="btn btn-md btn-secondary-hover">장바구니 담기</button>
        <button class="btn btn-md btn-secondary-pressed">장바구니 담기</button>
        <button class="btn btn-md btn-secondary-focus">장바구니 담기</button>
        <button class="btn btn-md btn-secondary-disabled">장바구니 담기</button>
      </div>

      <!-- Text & Small Row -->
      <div class="section-label" style="margin-top: 12px;">Text Action & Small Button Size</div>
      <div class="btn-matrix">
        <button class="btn btn-md btn-text">공간별로 보기 →</button>
        <button class="btn btn-md btn-text btn-text-hover">두 번째 쓰임 보기 →</button>
        <button class="btn btn-sm btn-primary">Small 버튼</button>
        <button class="btn btn-sm btn-secondary">Small 버튼</button>
        <button class="btn btn-sm btn-secondary" style="border-radius: 50%; width: 36px; height: 36px; padding: 0;">✕</button>
      </div>
    </div>
  </div>
</body>
</html>
